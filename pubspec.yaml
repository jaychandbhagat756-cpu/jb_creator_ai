  path_provider: ^2.1.5
  shared_preferences: ^2.5.3  # 🎯 Professional Dark Mode के लिए जोड़ा गया

  # Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 🎯 Google Fonts Package जोड़ा गया
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true