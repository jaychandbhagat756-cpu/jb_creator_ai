name: jb_creator_ai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Required Packages
  http: ^1.6.0
  provider: ^6.1.5
  uuid: ^4.5.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0

  # Utilities
  intl: ^0.20.3
